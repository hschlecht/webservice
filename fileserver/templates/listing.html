<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Index of /{{ current_path }}</title>
  <style>
    body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; margin: 2rem; color: #1a1a1a; }
    h1 { font-size: 1.2rem; word-break: break-all; }
    table { border-collapse: collapse; width: 100%; max-width: 900px; }
    th, td { text-align: left; padding: 0.4rem 0.8rem; border-bottom: 1px solid #eee; }
    th { color: #666; font-weight: 600; font-size: 0.85rem; text-transform: uppercase; }
    a { color: #0b5fff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .dir::before { content: "\1F4C1 "; }
    .file::before { content: "\1F4C4 "; }
    .size, .modified { color: #666; font-size: 0.9rem; white-space: nowrap; }
    form { margin-top: 1.5rem; }
    button { font: inherit; padding: 0.4rem 0.9rem; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Index of /{{ current_path }}</h1>
  <table>
    <thead>
      <tr><th>Name</th><th>Size</th><th>Modified</th></tr>
    </thead>
    <tbody>
      {% if parent_rel is not none %}
      <tr>
        <td><a class="dir" href="/browse/{{ parent_rel }}">..</a></td>
        <td class="size"></td>
        <td class="modified"></td>
      </tr>
      {% endif %}
      {% for entry in entries %}
      <tr>
        <td><a class="{{ 'dir' if entry.is_dir else 'file' }}" href="/browse/{{ entry.rel_path }}">{{ entry.name }}{{ '/' if entry.is_dir else '' }}</a></td>
        <td class="size">{{ entry.size }}</td>
        <td class="modified">{{ entry.modified }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>

  <form action="/options" method="post">
    <button type="submit">Show start_server.py options</button>
  </form>
</body>
</html>
